[project]
name = "turbo-design"
version = "1.4.3"
description = "TurboDesign is a library used to design turbines and compressors using radial equilibrium."
authors = [
    { name = "Paht Juangphanich", email = "paht.juangphanich@nasa.gov" }
]
requires-python = ">=3.9"
dependencies = [
    "cantera",
    "pyturbo-aero",
    "plot3d",
    "numpy",
    "scipy",
    "findiff",
    # turbodesign/loss/turbine/{craigcox,traupel,ainleymathieson,kackerokapuu}.py all
    # `import requests` at module scope, but it was never declared: a clean `pip install
    # turbo-design` yields a package that raises ImportError on those four loss models.
    # It goes unnoticed because requests is present transitively in most environments.
    "requests",
    "matplotlib",
    "pandas",
    "shapely",
]

[project.optional-dependencies]
# examples/EEE-HPT/eee_hpt_process_geometry.py imports pyiges (with its "full" extra,
# which pulls in geomdl) to read IGES geometry files. It was never declared anywhere
# except as an ad hoc `!pip install pyiges[full]` cell in the EEE-HPT/EEE-HPC notebooks,
# so `uv sync` silently removed it on every run. Not available on macOS.
examples = [
    "pyiges[full]",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
]
docs = [
    "sphinx",
    "sphinx-rtd-theme",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["turbodesign"]

[tool.hatch.build.targets.sdist]
# Without this, hatchling ships the whole git tree: examples/ (327MB of .lpk/.szplt
# CFD files) and references/ (98MB) alone blow the sdist past PyPI's 100MB upload
# limit (it was ~336MB), breaking every future `uv build`/publish.
only-include = ["turbodesign", "README.md", "pyproject.toml"]

[tool.pytest.ini_options]
markers = [
    "slow: takes multiple seconds (e.g. runs an optimizer-driven example); deselect with '-m \"not slow\"'",
]
