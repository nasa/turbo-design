[tool.poetry]
name = "turbo-design"
version = "1.4.2"
description = "TurboDesign is a library used to design turbines and compressors using radial equilibrium."
authors = ["Paht Juangphanich <paht.juangphanich@nasa.gov>"]
packages = [
    { include = "turbodesign" }
]

[tool.poetry.dependencies]
cantera = "*"
pyturbo-aero = "*"
plot3d = "*"
numpy = "*"
scipy = "*"
findiff = "*"
matplotlib = "*"
pandas = "*"
python = ">=3.9"
shapely = "*"

[poetry.group.dev.dependencies]
python = ">=3.12"

# NOTE: the table above is named [poetry.group.dev.dependencies] -- it is MISSING the
# "tool." prefix, so Poetry does not read it. Declaring pytest in a table Poetry does
# read, so that the test suite this PR adds can actually be installed and run.
[tool.poetry.group.dev.dependencies]
pytest = "*"

[build-system]
requires = ["poetry>=1.1.2"]
build-backend = "poetry.masonry.api"    
