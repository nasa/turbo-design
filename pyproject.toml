[tool.poetry]
name = "turbo-design"
version = "1.4.2"
description = "TurboDesign is a library used to design turbines and compressors using radial equilibrium."
authors = ["Paht Juangphanich <paht.juangphanich@nasa.gov>"]
packages = [
    { include = "turbodesign" }
]

[tool.poetry.dependencies]
cantera = "*"
pyturbo-aero = "*"
plot3d = "*"
numpy = "*"
scipy = "*"
findiff = "*"
matplotlib = "*"
pandas = "*"
python = ">=3.9"
shapely = "*"

[poetry.group.dev.dependencies]
python = ">=3.12"

# NOTE: the table above is missing the "tool." prefix, so Poetry does not read it as a
# dependency group. Left as it is: correcting it would change dependency resolution, which
# is outside the scope of a change that adds tests.
[tool.poetry.group.dev.dependencies]
pytest = ">=8.0"

[build-system]
requires = ["poetry>=1.1.2"]
build-backend = "poetry.masonry.api"

[tool.pytest.ini_options]
markers = [
    "slow: takes multiple seconds (e.g. runs an optimizer-driven example); deselect with '-m \"not slow\"'",
]
