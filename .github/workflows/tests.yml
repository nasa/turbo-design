name: tests
on: [push, pull_request]
jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.0.1
        with:
          python-version: '3.12'
      - name: Install
        run: uv sync --group dev
      - name: Run tests
        run: uv run pytest tests/ -v
